name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: install sing-box
        run: |
          curl -fsSL https://sing-box.app/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/sagernet-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/sagernet-keyring.gpg] https://deb.sagernet.org/ * *' | sudo tee /etc/apt/sources.list.d/sagernet.list > /dev/null
          sudo apt-get update && sudo apt-get install -y sing-box
      - run: go test -tags integration ./internal/core/singbox/ -v
