version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - errorlint
    - gocritic
    - contextcheck
  settings:
    revive:
      rules:
        - name: package-comments
        - name: exported
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Golden files are committed fixtures; 0644 is intentional.
      - linters: [gosec]
        path: _test\.go
      # Core binaries, configs and logs come from user config/flags by design.
      - linters: [gosec]
        path: internal/(core/singbox/core|core/singbox/version|process/supervisor|storage/storage)\.go
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SabirDzh/VpnCLI
